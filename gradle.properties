# Project-wide Gradle settings.
# For more details on how to configure your build, see
# http://www.gradle.org/docs/current/userguide/build_runtime_charts.html

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build, see
# http://www.gradle.org/docs/current/userguide/build_runtime_charts.html

# Specifies the JVM arguments used for the Gradle Daemon.
# Setting a specific amount of memory helps prevents memory issues with larger projects.
# Default value: -Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are part of the Android SDK,
# and which are part of Android Open Source Project's AndroidX libraries.
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Suppress warning for compileSdk 35
android.suppressUnsupportedCompileSdk=35
